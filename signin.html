<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Larkspur Lawn & Garden</title>
<meta name="description" content="Fictional demo business: sign in to see your quotes and visits.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="images/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<link rel="stylesheet" href="css/site.css">
</head>
<body data-no-launcher>
<main id="main" class="signin">
  <a class="back" href="index.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Back to home</a>
  <div class="signin-head">
    <svg width="56" height="56" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#2F6B3F"/><path d="M20 31V16M20 22c-5 0-8-3-8-8 5 0 8 3 8 8zM20 19c0-4 3-7 8-7 0 5-3 7-8 7z" stroke="#F7F8F4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Sign in to Larkspur</h1>
    <p>See your quotes, visits and payments.</p>
  </div>
  <form class="signin-form" id="signin-form" novalidate>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required></div>
    <button class="btn btn-primary btn-block" type="submit">Email me a sign-in link</button>
    <p class="hint">No password needed. The link works once and expires in 15 minutes.</p>
    <p class="notice" id="signin-status" role="status" hidden></p>
  </form>
  <p class="owner-link">Run Larkspur? <a id="owner-dashboard" href="https://larkspur-dashboard.vercel.app/portal/login">Owner dashboard sign-in</a></p>
  <p class="signin-foot">Larkspur Lawn &amp; Garden · fictional demo business</p>
</main>
<script src="js/config.js"></script>
<script src="js/site.js"></script>
<script src="js/gus.js"></script>
</body>
</html>
