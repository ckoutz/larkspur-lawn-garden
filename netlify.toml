[build]
  publish = "."
  command = ""

# The Larkspur owner dashboard (a Vercel deployment) is served under this
# site's own address, so the owner view can show it next to the chat (same
# origin: its sign-in cookie lives here). GVAS e-mail links (site_url) to the
# customer portal (/portal) and quote pages (/q) land here too.
[[redirects]]
  from = "/portal"
  to = "https://larkspur-dashboard.vercel.app/portal"
  status = 200

[[redirects]]
  from = "/portal/*"
  to = "https://larkspur-dashboard.vercel.app/portal/:splat"
  status = 200

[[redirects]]
  from = "/q/*"
  to = "https://larkspur-dashboard.vercel.app/q/:splat"
  status = 200

[[redirects]]
  from = "/_next/*"
  to = "https://larkspur-dashboard.vercel.app/_next/:splat"
  status = 200

# The site's own content policy is a <meta> tag in each page, because these
# headers also reach the proxied dashboard. Only this site may frame pages.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "frame-ancestors 'self'"

# The screenshot tool lives in the repo but is not part of the site.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
