[build]
  publish = "."
  command = ""

# Links GVAS e-mails point at this site (site_url): customer sign-in
# (/portal/login?token=…), the portal and quote pages live on the Larkspur
# dashboard. Netlify keeps the query string.
[[redirects]]
  from = "/portal"
  to = "https://larkspur-dashboard.vercel.app/portal"
  status = 302

[[redirects]]
  from = "/portal/*"
  to = "https://larkspur-dashboard.vercel.app/portal/:splat"
  status = 302

[[redirects]]
  from = "/q/*"
  to = "https://larkspur-dashboard.vercel.app/q/:splat"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://web-demo-5831.up.railway.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
